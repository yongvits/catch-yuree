<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b2010" />
      <stop offset="50%" stop-color="#241207" />
      <stop offset="100%" stop-color="#140903" />
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="48%" r="45%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="shellGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#dfb078" />
      <stop offset="100%" stop-color="#b87c3e" />
    </linearGradient>
    <linearGradient id="pinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6" />
      <stop offset="50%" stop-color="#df2d64" />
      <stop offset="100%" stop-color="#be185d" />
    </linearGradient>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)" />
  <rect x="14" y="14" width="484" height="484" rx="96" fill="none" stroke="#d97706" stroke-opacity="0.4" stroke-width="6" />
  <circle cx="256" cy="256" r="210" fill="url(#glowGrad)" />

  <!-- Decorative Rice Grains -->
  <g opacity="0.88">
    <ellipse cx="118" cy="128" rx="34" ry="13" fill="#fef9c3" stroke="#92400e" stroke-width="4" transform="rotate(-32 118 128)" />
    <ellipse cx="394" cy="134" rx="34" ry="13" fill="#fffbeb" stroke="#92400e" stroke-width="4" transform="rotate(28 394 134)" />
    <ellipse cx="112" cy="378" rx="32" ry="12" fill="#fffbeb" stroke="#92400e" stroke-width="4" transform="rotate(24 112 378)" />
    <ellipse cx="400" cy="382" rx="32" ry="12" fill="#fef9c3" stroke="#92400e" stroke-width="4" transform="rotate(-26 400 382)" />
  </g>

  <!-- Weevil Character (Yuree) -->
  <g transform="translate(256, 260) scale(1.78)">
    <!-- 6 Insect Legs -->
    <g stroke="#181818" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M -45 -48 Q -74 -58 -84 -35" />
      <path d="M -48 -14 Q -86 -18 -92 -4" />
      <path d="M -38 22 Q -68 42 -62 66" />
      <path d="M 45 -48 Q 74 -58 84 -35" />
      <path d="M 48 -14 Q 86 -18 92 -4" />
      <path d="M 38 22 Q 68 42 62 66" />
    </g>
    <g stroke="#ca945a" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M -45 -48 Q -74 -58 -84 -35" />
      <path d="M -48 -14 Q -86 -18 -92 -4" />
      <path d="M -38 22 Q -68 42 -62 66" />
      <path d="M 45 -48 Q 74 -58 84 -35" />
      <path d="M 48 -14 Q 86 -18 92 -4" />
      <path d="M 38 22 Q 68 42 62 66" />
    </g>

    <!-- Elytra Shell -->
    <g transform="translate(0, -24)">
      <path d="M -40 30 C -50 -18, -30 -52, 0 -52 C 30 -52, 50 -18, 40 30 Q 0 38 -40 30 Z"
            fill="url(#shellGrad)" stroke="#181818" stroke-width="6" />
      <path d="M 0 -51 L 0 33" stroke="#181818" stroke-width="3.5" stroke-linecap="round" />
      <path d="M -14 -47 Q -22 -6 -16 31" stroke="#181818" stroke-width="3" fill="none" stroke-linecap="round" />
      <path d="M 14 -47 Q 22 -6 16 31" stroke="#181818" stroke-width="3" fill="none" stroke-linecap="round" />
      <path d="M -27 -40 Q -37 -4 -29 29" stroke="#181818" stroke-width="3" fill="none" stroke-linecap="round" />
      <path d="M 27 -40 Q 37 -4 29 29" stroke="#181818" stroke-width="3" fill="none" stroke-linecap="round" />
    </g>

    <!-- Pronotum / Thorax -->
    <ellipse cx="0" cy="-4" rx="34" ry="18" fill="#ca945a" stroke="#181818" stroke-width="6" />
    <line x1="0" y1="-20" x2="0" y2="12" stroke="#181818" stroke-width="3.5" />

    <!-- Fluffy Pink Ruff Bows -->
    <g transform="translate(-31, -3)" fill="url(#pinkGrad)" stroke="#181818" stroke-width="4.5">
      <circle cx="-7" cy="-12" r="11" />
      <circle cx="7" cy="-10" r="12" />
      <circle cx="11" cy="2" r="11" />
      <circle cx="5" cy="13" r="12" />
      <circle cx="-7" cy="13" r="11" />
      <circle cx="-12" cy="1" r="10" />
    </g>
    <g transform="translate(31, -3)" fill="url(#pinkGrad)" stroke="#181818" stroke-width="4.5">
      <circle cx="-7" cy="-10" r="12" />
      <circle cx="7" cy="-12" r="11" />
      <circle cx="12" cy="1" r="10" />
      <circle cx="7" cy="13" r="11" />
      <circle cx="-5" cy="13" r="12" />
      <circle cx="-11" cy="2" r="11" />
    </g>

    <!-- Head -->
    <g transform="translate(0, 11)">
      <ellipse cx="0" cy="0" rx="20" ry="16" fill="#e6c3a8" stroke="#181818" stroke-width="5.5" />
      <!-- Big Glossy Eyes -->
      <ellipse cx="-9" cy="-2" rx="6.5" ry="8.5" fill="#111111" transform="rotate(-5 -9 -2)" />
      <circle cx="-7.5" cy="-4.5" r="3" fill="#ffffff" />
      <circle cx="-10" cy="1.5" r="1.4" fill="#ffffff" />
      <ellipse cx="9" cy="-2" rx="6.5" ry="8.5" fill="#111111" transform="rotate(5 9 -2)" />
      <circle cx="10.5" cy="-4.5" r="3" fill="#ffffff" />
      <circle cx="8" cy="1.5" r="1.4" fill="#ffffff" />

      <!-- Snout & Antennae -->
      <path d="M 0 8 Q -5 30 0 54" stroke="#181818" stroke-width="9" stroke-linecap="round" fill="none" />
      <path d="M -4 16 L -17 25 L -19 41" stroke="#181818" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" />
      <path d="M 4 16 L 17 25 L 19 41" stroke="#181818" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    </g>
  </g>
</svg>
